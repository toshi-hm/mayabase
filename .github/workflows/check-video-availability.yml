name: YouTube動画の生存監視

on:
  schedule:
    - cron: "0 21 * * 3"
  workflow_dispatch:

concurrency:
  group: check-video-availability
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - name: 依存関係のインストール
        run: bun install --frozen-lockfile
      - name: YouTube動画の生存を確認
        id: check
        run: bun run check:video-availability
      - name: 異常をIssueへ通知
        uses: actions/github-script@v7
        env:
          HAS_UNAVAILABLE: \${{ steps.check.outputs.has_unavailable }}
          SUMMARY: \${{ steps.check.outputs.summary }}
        with:
          script: |
            const marker = "<!-- check-video-availability-alert (#322) -->";
            const label = "broken-video-alert";
            const title = "⚠️ YouTube動画の取得異常を検知しました";
            const hasUnavailable = process.env.HAS_UNAVAILABLE === "true";
            const summary = process.env.SUMMARY || "詳細不明";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: label, per_page: 100,
            });
            const existing = issues.find((issue) => issue.body?.includes(marker));
            if (hasUnavailable && !existing) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title,
                body: [marker, summary, "", "videos.jsonを確認し、削除・非公開化された動画を手動で整理してください。"].join("\n"),
                labels: [label],
              });
            } else if (hasUnavailable && existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                body: "再検知しました。\n\n" + summary,
              });
            } else if (!hasUnavailable && existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                state: "closed", state_reason: "completed",
              });
            }
