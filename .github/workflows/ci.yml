name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: 依存関係のインストール
        run: bun install --frozen-lockfile

      - name: Lint(Biome)
        run: bun run lint

      - name: Format チェック(Prettier / Biome)
        run: bun run format:check

      - name: 型チェック(astro check)
        run: bun run check

      - name: テスト
        run: bun test

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # このリポジトリは JS/Bun プロジェクトで requirements.txt / pyproject.toml 等の
          # Python 依存関係ファイルを持たない(uvx で fonttools をバージョン固定インストールするのみ)ため、
          # デフォルトの依存関係キャッシュは常にヒットせず無意味な警告を出すだけ。無効化する。
          enable-cache: false

      - name: フォントサブセットの最新性チェック
        run: |
          bun run font:subset
          git diff --exit-code -- public/fonts || {
            echo "::error::public/fonts が最新の動画データ・タイトルと同期していません。'bun run font:subset' を実行し、生成物をコミットしてください。"
            exit 1
          }

      - name: ビルド
        run: bun run build

      - name: ビルド成果物のアップロード
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci
    env:
      E2E_USE_EXISTING_DIST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: 依存関係のインストール
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Playwright Chromiumのインストール
        run: bunx playwright install --with-deps chromium

      - name: ブラウザE2Eテスト
        run: bun run test:e2e

      - name: 失敗時にPlaywrightレポートをアップロード
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse-shard:
    runs-on: ubuntu-latest
    # 13ページ x numberOfRuns:5 の計測を4シャードに分割して並列実行することで
    # 直列実行(以前は timeout-minutes: 28 が必要だった)より大幅に短縮する。
    # numberOfRuns: 5 自体は計測の安定性のため維持する(#248 / #374)。
    timeout-minutes: 12
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Lighthouse対象動画URLの生成(shard ${{ matrix.shard }}/4)
        env:
          LHCI_SHARD_INDEX: ${{ matrix.shard }}
          LHCI_SHARD_COUNT: 4
        run: bun run scripts/generate-lighthouse-config.ts

      - name: Lighthouse CI(SEO=100 ほかを lighthouserc.json の assertion でゲート)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.generated.json

      - name: 失敗時に Lighthouse レポートをアップロード
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-reports-shard-${{ matrix.shard }}
          path: .lighthouseci/
          retention-days: 7

  lighthouse:
    # 必須ステータスチェック名を維持するための集約ジョブ。
    # 実体の計測は lighthouse-shard の並列マトリクスで行う。
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: lighthouse-shard
    if: always()
    steps:
      - name: 全シャードの結果を確認
        run: |
          result="${{ needs.lighthouse-shard.result }}"
          echo "lighthouse-shard result: ${result}"
          test "${result}" = "success"
