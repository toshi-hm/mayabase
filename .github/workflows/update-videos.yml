name: 動画データの定期更新

on:
  schedule:
    # 毎日 21:00 UTC(日本時間 6:00)
    - cron: "0 21 * * *"
  workflow_dispatch:

concurrency:
  group: update-videos
  cancel-in-progress: false

# 注意: main にブランチ保護(直接 push 禁止)を設定する場合は
# github-actions[bot] を除外するか、PR ベースのフローに変更してください
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # 沈黙的な取得失敗の検知時に Issue を起票/クローズするため(#201)
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: 依存関係のインストール
        run: bun install --frozen-lockfile

      - name: YouTube 動画データの取得
        # YOUTUBE_API_KEY(リポジトリ Secrets)を設定すると Data API で全動画を取得する。
        # 未設定でも RSS(最新 15 件)で動作する(段階的に過去動画が蓄積される)。
        #
        # 新着動画のプッシュ通知(#157): CLOUDFLARE_*/VAPID_* の Secrets が未設定の場合、
        # scripts/send-push-notifications.ts は何もせずスキップする(このステップ自体は失敗しない)。
        # セットアップ手順は .dev.vars.example を参照。
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: bun run fetch

      - name: 動画データの鮮度チェック
        # fetch-videos.ts は取得に失敗しても既存 videos.json を残して exit 0 する設計(意図的)。
        # そのため取得が何日連続で失敗し続けても、このワークフロー自体は「成功」であり続け、
        # 誰にも気づかれない(#201)。videos.json の fetchedAt を見て沈黙的な停滞を検知する。
        id: freshness
        run: bun run fetch:check-freshness

      - name: 取得停滞時の Issue 通知(#201)
        # 鮮度チェックが stale(閾値超過)を検知した場合に Issue を起票して通知する。
        # 既にアラート Issue が open であれば重複作成せず、逆に復旧を検知したら自動クローズする
        # (Issue #201 の検討事項: 放置 Issue が溜まるリスクへの対応)。
        # ワークフロー自体はこれまで通り exit 0 を維持する(既存方針を壊さない)ため、
        # この通知処理自体が失敗してもワークフローは失敗させない(try/catch で握りつぶす)。
        uses: actions/github-script@v7
        env:
          FRESHNESS_STALE: ${{ steps.freshness.outputs.stale }}
          FRESHNESS_SUMMARY: ${{ steps.freshness.outputs.summary }}
        with:
          script: |
            try {
              const marker = "<!-- fetch-freshness-alert (#201) -->";
              const label = "video-fetch-alert";
              const title = "⚠️ 動画データの自動取得が沈黙的に失敗している可能性があります";
              const stale = process.env.FRESHNESS_STALE === "true";
              const summary = process.env.FRESHNESS_SUMMARY || "(詳細不明)";
              const runUrl =
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                `/actions/runs/${context.runId}`;

              const { data: openIssues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                labels: label,
                per_page: 100,
              });
              const existing = openIssues.find((issue) => issue.body?.includes(marker));

              if (stale) {
                if (existing) {
                  console.log(
                    `既存のアラート Issue #${existing.number} が既に open のため、新規作成せず終了します(重複防止)。`,
                  );
                  return;
                }
                const body = [
                  marker,
                  summary,
                  "",
                  `直近の実行: ${runUrl}`,
                  "",
                  "RSS/YouTube Data API の仕様変更、YOUTUBE_API_KEY の失効など、",
                  "動画データが更新されなくなった原因を調査してください。",
                  "取得が復旧すると、このIssueは次回実行時に自動的にクローズされます。",
                ].join("\n");
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: [label],
                });
                console.log(`アラート Issue #${created.data.number} を作成しました。`);
              } else if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `✅ 動画データの取得が復旧しました。${summary}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: "closed",
                  state_reason: "completed",
                });
                console.log(`復旧を確認したため Issue #${existing.number} をクローズしました。`);
              }
            } catch (error) {
              console.warn(`Fetch freshness alert step failed non-fatally: ${error}`);
            }

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: フォントサブセットの再生成
        # このワークフローの自動コミット(GITHUB_TOKEN)は ci.yml をトリガーできず(#128)、
        # 動画タイトルの自動更新で新しい文字種が混入してもフォントサブセットの最新性チェックが
        # 素通りしてしまう。ここで直接再生成し、差分があれば videos.json 等と同じコミットに含める。
        run: bun run font:subset

      - name: 取得データの検証(lint / format / 型チェック / test / build)
        # このワークフローの自動コミット(GITHUB_TOKEN)は ci.yml をトリガーできない(#128)ため、
        # 取得した動画データに起因する回帰(不正なデータによるテスト失敗・ビルド失敗・
        # フォーマット崩れ等)が無検証で main に反映されてしまう(#168)。push 前にここで
        # ci.yml と同等の検証を行い、失敗時はワークフロー自体を失敗させて push を止める。
        run: |
          bun run lint
          bun run format:check
          bun run check
          bun test
          bun run build

      - name: 変更があればコミット
        run: |
          if git diff --quiet src/data/videos.json src/data/channel-stats.json src/data/channel-stats-history.json public/fonts; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/videos.json src/data/channel-stats.json src/data/channel-stats-history.json public/fonts
          git commit -m "chore: 動画データを自動更新"
          # 実行中に main へ別コミットが入った場合に備えてリベースしてから push
          git fetch origin main
          git rebase origin/main
          git push
