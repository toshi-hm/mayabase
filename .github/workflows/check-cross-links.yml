name: サイト内クロスリンクの充足性チェック

on:
  schedule:
    # 毎週木曜 21:00 UTC(日本時間 金曜 6:00)。check-links.yml(月曜)と曜日をずらし、
    # Issue 通知の集中を避ける(#344)。
    - cron: "0 21 * * 4"
  workflow_dispatch:

concurrency:
  group: check-cross-links
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # 孤立したクロスリンク検知時に Issue を起票/クローズするため(#254 と同じパターン)
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: 依存関係のインストール
        run: bun install --frozen-lockfile

      - name: 愛用ガジェット・用語集の孤立したクロスリンクを確認
        # gear.json / glossary.json のうち、動画・相互のどちらからも参照されていない項目を検知する。
        id: check
        run: bun run check:cross-links

      - name: 孤立検知時の Issue 通知(#344)
        # check-links.yml(#254)と同じ「サイレントな劣化を Issue 通知で顕在化する」パターンを
        # 踏襲する。既にアラート Issue が open であれば重複作成せず、逆に全項目の解消を
        # 検知したら自動クローズする。
        uses: actions/github-script@v8
        env:
          HAS_ORPHANS: ${{ steps.check.outputs.has_orphans }}
          ORPHANED_GEAR_COUNT: ${{ steps.check.outputs.orphaned_gear_count }}
          ORPHANED_GLOSSARY_COUNT: ${{ steps.check.outputs.orphaned_glossary_count }}
          CHECK_SUMMARY: ${{ steps.check.outputs.summary }}
        with:
          script: |
            const marker = "<!-- check-cross-links-alert (#344) -->";
            const label = "orphaned-cross-link-alert";
            const title = "⚠️ 愛用ガジェット・用語集に孤立したクロスリンクを検知しました";
            const hasOrphans = process.env.HAS_ORPHANS === "true";
            const summary = process.env.CHECK_SUMMARY || "(詳細不明)";
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
              per_page: 100,
            });
            const existing = openIssues.find((issue) => issue.body?.includes(marker));

            if (hasOrphans) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `🔁 再検知しました(ガジェット ${process.env.ORPHANED_GEAR_COUNT} 件 / 用語集 ${process.env.ORPHANED_GLOSSARY_COUNT} 件)。\n\n${summary}\n\n直近の実行: ${runUrl}`,
                });
                console.log(
                  `既存のアラート Issue #${existing.number} が既に open のため、新規作成せずコメントのみ追加しました。`,
                );
                return;
              }
              const body = [
                marker,
                summary,
                "",
                `直近の実行: ${runUrl}`,
                "",
                "上記の項目に、対応する videoIds / relatedVideoIds / relatedGearNames の追記が",
                "漏れていないか確認してください(意図的に単独掲載している項目であれば対応不要です)。",
                "全項目の解消を確認すると、このIssueは次回実行時に自動的にクローズされます。",
              ].join("\n");
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
              console.log(`アラート Issue #${created.data.number} を作成しました。`);
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `✅ 孤立したクロスリンクの解消を確認しました。${summary}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed",
              });
              console.log(`復旧を確認したため Issue #${existing.number} をクローズしました。`);
            }
